# GitHub Actions workflow: CI on every change, and release-on-version-bump for main.
#
# - build:   build the plugin ZIP and upload it as a workflow artifact.
# - test:    run the 'check' task; upload test reports on failure.
# - verify:  run 'verifyPlugin' (IntelliJ Plugin Verifier); upload its reports.
# - release: ONLY on push to main, after build/test/verify pass. Reads the version from
#            gradle.properties and compares it to the git tag list:
#              * tag v<version> already exists  -> nothing to do (succeeds, no release).
#              * version is new                 -> require CHANGELOG.md to have a matching
#                                                  ## [<version>] section (fails otherwise,
#                                                  BEFORE tagging/releasing), then tag the
#                                                  commit, publish the GitHub Release with the
#                                                  built artifact, and refresh updatePlugins.xml.
# - deploy-pages: publish the regenerated updatePlugins.xml to GitHub Pages.
#
# Release model = Option (ii): bump `version` in gradle.properties AND run `./gradlew patchChangelog`
# locally, commit both together, push to main. This workflow validates and publishes; it never
# writes back to the repo. No JetBrains Marketplace and no plugin signing.
#
# One-time setup before the first release:
#   - Repo Settings -> Pages -> Source: "GitHub Actions".
#   - The repository must stay PUBLIC (the IDE downloads the asset + updatePlugins.xml without auth).
#
# GitHub Actions reference: https://docs.github.com/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Store an already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

  # Run tests and upload test reports on failure
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run tests
      - name: Run Tests
        run: ./gradlew check

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Release-on-version-bump: only on push to main, only after build/test/verify pass.
  release:
    name: Release
    needs: [ build, test, verify ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      do_release: ${{ steps.gate.outputs.do_release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      # Need full history + tags to compare the version against the existing tag list.
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gate: read version from gradle.properties, compare to the git tag list.
      - name: Decide whether to release
        id: gate
        run: |
          VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read 'version' from gradle.properties."; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(git tag -l "v$VERSION")" ]; then
            echo "Tag v$VERSION already exists — version already released, nothing to do."
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version v$VERSION is new — proceeding to release."
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.gate.outputs.do_release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        if: steps.gate.outputs.do_release == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Enforce "version bumped in BOTH places": fail BEFORE tagging/releasing if the
      # CHANGELOG has no matching section, then extract the release notes for that version.
      - name: Validate changelog & extract release notes
        if: steps.gate.outputs.do_release == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          mkdir -p build
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::gradle.properties is at $VERSION but CHANGELOG.md has no '## [$VERSION]' section. Bump the version AND run './gradlew patchChangelog', then commit both before pushing."
            exit 1
          fi
          ./gradlew getChangelog --project-version="$VERSION" --no-header --quiet --console=plain --no-configuration-cache --output-file=build/release-notes.md
          test -s build/release-notes.md || { echo "::error::CHANGELOG '## [$VERSION]' section is empty."; exit 1; }

      # Reuse the exact artifact that build/test/verify already produced and verified.
      - name: Download built plugin
        if: steps.gate.outputs.do_release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: dist

      # Atomic: creates the tag at this commit AND publishes the release in one operation.
      - name: Tag commit & publish release
        if: steps.gate.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          ZIP=$(ls dist/*.zip)
          gh release create "v$VERSION" "$ZIP" \
            --target "${GITHUB_SHA}" \
            --title "v$VERSION" \
            --notes-file build/release-notes.md

      - name: Generate updatePlugins.xml & landing page
        if: steps.gate.outputs.do_release == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          mkdir -p site
          ZIP_NAME=$(basename "$(ls dist/*.zip)")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ZIP_NAME}"
          cat > site/updatePlugins.xml <<XML
          <plugins>
            <plugin id="me.knivram.IamPlugin" url="${URL}" version="${VERSION}">
              <name>Config Navigator</name>
              <idea-version since-build="252"/>
            </plugin>
          </plugins>
          XML
          # Render the landing page from the template, substituting the release-specific values.
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/updatePlugins.xml"
          GITHUB_URL="https://github.com/${GITHUB_REPOSITORY}"
          sed -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{DOWNLOAD_URL}}|${URL}|g" \
              -e "s|{{REPO_URL}}|${REPO_URL}|g" \
              -e "s|{{GITHUB_URL}}|${GITHUB_URL}|g" \
              .github/pages/index.html > site/index.html
          echo "Generated updatePlugins.xml:"; cat site/updatePlugins.xml

      - name: Upload Pages artifact
        if: steps.gate.outputs.do_release == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publish the regenerated updatePlugins.xml (+ index.html) to GitHub Pages.
  deploy-pages:
    name: Publish to GitHub Pages
    needs: release
    if: needs.release.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
